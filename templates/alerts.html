<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE Alerts Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .violation-card {
            transition: transform 0.2s;
        }
        .violation-card:hover {
            transform: translateY(-5px);
        }
        .badge-no-helmet { background-color: #dc3545; }
        .badge-no-vest { background-color: #fd7e14; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🚨 PPE Violation Dashboard</a>
            <button class="btn btn-outline-danger btn-sm" onclick="clearHistory()">Clear History</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col">
                <h5>Recent Violations <span class="badge bg-secondary" id="alertCount">0</span></h5>
            </div>
            <div class="col-auto">
                <small class="text-muted" id="lastUpdated">Last updated: Never</small>
            </div>
        </div>

        <div id="alertsContainer" class="row">
            <!-- Alerts will be injected here -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/ppe-alerts';
        
        async function fetchAlerts() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                renderAlerts(data.alerts);
                document.getElementById('alertCount').textContent = data.total;
                document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Error fetching alerts:', error);
            }
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            
            if (alerts.length === 0) {
                container.innerHTML = `<div class="col-12 text-center text-muted py-5"><h4>No violations detected ✅</h4></div>`;
                return;
            }

            // Sort by timestamp descending
            alerts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            let html = '';
            alerts.forEach(alert => {
                const date = new Date(alert.timestamp).toLocaleString();
                const badgeClass = alert.violation_type.includes('HELMET') ? 'badge-no-helmet' : 'badge-no-vest';
                
                html += `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card violation-card shadow-sm h-100">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <strong>${alert.person_id}</strong>
                            <span class="badge ${badgeClass}">${alert.violation_type}</span>
                        </div>
                        <div class="card-body">
                            <p class="card-text small text-muted">
                                📅 ${date}<br>
                                📷 ${alert.camera_id} (Track ${alert.track_id})
                            </p>
                            ${alert.video_link ? 
                                `<video controls class="w-100 rounded" style="max-height: 200px; background: black;">
                                    <source src="${alert.video_link}" type="video/webm">
                                    Your browser does not support the video tag.
                                </video>` : 
                                '<div class="alert alert-secondary py-1">No Video</div>'
                            }
                        </div>
                    </div>
                </div>
                `;
            });
            
            container.innerHTML = html;
        }

        async function clearHistory() {
            if(!confirm("Are you sure you want to clear all violation history?")) return;
            
            try {
                await fetch('/api/ppe-alerts/clear', { method: 'DELETE' });
                fetchAlerts();
            } catch (error) {
                alert('Failed to clear history');
            }
        }

        // Poll every 5 seconds
        fetchAlerts();
        setInterval(fetchAlerts, 5000);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
