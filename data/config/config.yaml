# Global configuration for PPE Detection System

model:
  path: "yolov8n.pt"  # Standard YOLO for Person & Vehicle Detection
  
  # Custom Model Paths
  models:
    helmet: "helmet.pt"
    vest: "yolov8_vest_medium.pt"  # UPDATED: New medium model
    face: "yolov8m-face-lindevs.pt"

  input_size: 320
  device: "auto"
  conf_threshold: 0.25
  iou_threshold: 0.45
  
  # Class IDs
  classes:
    person: 0       # COCO ID for Person
    car: 2          # COCO ID for Car
    motorcycle: 3   # COCO ID for Motorcycle
    bus: 5          # COCO ID for Bus
    truck: 7        # COCO ID for Truck
    forklift: -1    # Custom class (if available in vest model)
    helmet: 12      # head_helmet
    vest: 16        # vest (check if this ID matches new medium model)

tracking:
  iou_threshold: 0.5  # Increased from 0.3 - higher = more strict matching, prevents ID switching
  max_lost_seconds: 0.1  # Nearly immediate removal when detection lost (reduced from 1.0)

camera:
  reconnect:
    initial_delay: 2.0
    max_delay: 30.0
    backoff_factor: 2.0  # delay * factor each attempt
    max_retries: 0       # 0 = infinite retries
  
  default_fps: 15
  ffmpeg_transport: "tcp"  # "tcp" or "udp" (TCP recommended for RTSP reliability)

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]  # Restrict this in production!

logging:
  level: "INFO"

alerts:
  enabled: true
  violation_threshold_seconds: 10.0
  alert_endpoint: "http://localhost:8000/api/ppe-alert"

# Multi-camera settings for parallel processing
multi_camera:
  max_cameras: 10
  frame_queue_size: 5
  reconnect_delay: 3.0
  
  # Batch inference settings (for GPU optimization)
  batch_inference:
    enabled: false  # DISABLED - using direct detection instead
    batch_size: 8
    timeout_ms: 100  # Max wait time to fill batch
  
  # GPU memory management
  gpu:
    memory_threshold_gb: 0.5  # Reserve 0.5GB VRAM
    max_instances: -1  # -1 = auto-calculate based on available VRAM
  
  # Performance monitoring
  monitoring:
    fps_update_interval: 1.0  # seconds
    metrics_log_interval: 10.0  # seconds

# Face detection and re-identification
face_detection:
  enabled: true
  model_path: "yolov8m-face-lindevs.pt"
  confidence_threshold: 0.5
  min_face_size: 30  # Minimum face size in pixels
  
face_tracking:
  similarity_threshold: 0.6  # Lower = stricter face matching
  max_face_age_seconds: 300  # Remember faces for 5 minutes
  min_stable_frames: 3  # Frames before ID considered stable
  reidentification_enabled: true
